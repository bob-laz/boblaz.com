<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>boblaz.com</title>
<meta name="description" content="nothing to see here">
<meta property="og:type" content="website">
<meta property="og:url" content="https://boblaz.com/">
<meta property="og:site_name" content="boblaz.com">
<meta property="og:title" content="boblaz.com">
<meta property="og:description" content="nothing to see here">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="boblaz.com">
<meta name="twitter:description" content="nothing to see here">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#3bf777">
<meta name="theme-color" content="#0a0e0a">
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #3bf777;
    --fg-dim: #1f8a45;
    --fg-bright: #baffce;
    --amber: #ffb545;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', monospace;
    font-size: 15px;
    overflow: hidden;
  }

  /* CRT scanline + vignette overlay */
  .crt {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 1px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
    mix-blend-mode: multiply;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    box-shadow: inset 0 0 18vw rgba(0, 0, 0, 0.75);
  }

  .flicker {
    animation: flicker 6s infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.94; }
    98% { opacity: 1; }
    99% { opacity: 0.9; }
  }

  #screen {
    position: relative;
    z-index: 1;
    height: 100vh;
    width: 100vw;
    padding: 3vh 4vw;
    overflow-y: auto;
    text-shadow: 0 0 6px rgba(59, 247, 119, 0.5), 0 0 1px rgba(59, 247, 119, 0.8);
    cursor: text;
  }

  #screen::-webkit-scrollbar { width: 0; }

  #log {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }

  .dim { color: var(--fg-dim); }
  .bright { color: var(--fg-bright); }
  .amber { color: var(--amber); }
  .prompt-label { color: var(--fg-bright); }

  #inputLine {
    display: flex;
    align-items: baseline;
    line-height: 1.5;
  }

  #inputLine .prompt-label {
    flex-shrink: 0;
    margin-right: 0.5ch;
  }

  #inputWrap {
    flex: 1;
    position: relative;
  }

  #typed {
    white-space: pre-wrap;
    word-break: break-word;
  }

  #cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    background: var(--fg-bright);
    vertical-align: text-bottom;
    margin-left: 1px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  #hiddenInput {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    left: -9999px;
  }

  a { color: var(--amber); }

  /* Matrix rain easter egg */
  #matrix {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: none;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="crt flicker"></div>
<div class="vignette"></div>

<div id="screen">
  <div id="log"></div>
  <div id="inputLine" style="display:none;">
    <span class="prompt-label">guest@boblaz</span><span class="dim">:~$</span>&nbsp;<div id="inputWrap"><span id="typed"></span><span id="cursor"></span></div>
  </div>
</div>

<input id="hiddenInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

<script>
(() => {
  const log = document.getElementById('log');
  const screen = document.getElementById('screen');
  const inputLine = document.getElementById('inputLine');
  const typedEl = document.getElementById('typed');
  const hiddenInput = document.getElementById('hiddenInput');

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function append(html) {
    const line = document.createElement('div');
    line.innerHTML = html;
    log.appendChild(line);
    screen.scrollTop = screen.scrollHeight;
  }

  async function typeLine(text, opts = {}) {
    const { speed = 12, cls = '' } = opts;
    const line = document.createElement('div');
    if (cls) line.className = cls;
    log.appendChild(line);
    for (let i = 0; i < text.length; i++) {
      line.textContent += text[i];
      screen.scrollTop = screen.scrollHeight;
      await sleep(speed);
    }
  }

  const boot = [
    { t: 'boblaz.com boot sequence — v1.0', cls: 'dim', speed: 8 },
    { t: '', speed: 0 },
    { t: '[  OK  ] Mounting /dev/personal-domain', speed: 4 },
    { t: '[  OK  ] Starting mail relay (that is why you are here)', speed: 4 },
    { t: '[  OK  ] Checking for interesting content ....... none found', speed: 4 },
    { t: '[  OK  ] Loading personality module', speed: 4 },
    { t: '[ WARN ] Personality module is mostly puns', speed: 4 },
    { t: '[  OK  ] Starting shell', speed: 4 },
    { t: '', speed: 0 },
  ];

  const files = {
    'readme.txt': 'You looked up a domain from an email address.\nThat is either healthy skepticism or excellent curiosity. Either way, welcome.',
    'secrets.txt': 'error: permission denied\n(there is nothing here, but "denied" sounded cooler than "empty")',
    '.plan': 'get coffee -> write code -> repeat',
  };

  const commands = {
    help() {
      return [
        'available commands:',
        '  help          show this list',
        '  whoami        find out who you are',
        '  about         what this site is for',
        '  contact       how to reach a human',
        '  ls            list files',
        '  cat <file>    read a file',
        '  sudo <cmd>    try your luck',
        '  matrix        you know the one',
        '  date          current date/time',
        '  clear         clear the screen',
      ].join('\n');
    },
    whoami() {
      const guesses = [
        'a curious human who typed an email domain into a browser',
        'someone double-checking this isn\'t a phishing domain (good instinct)',
        'probably not a robot. probably.',
      ];
      return guesses[Math.floor(Math.random() * guesses.length)];
    },
    about() {
      return 'This domain mostly exists to receive email.\nThe website is a bonus feature nobody asked for.';
    },
    contact() {
      return 'Reply to whatever email brought you here — those get read.\nThis page intentionally doesn\'t republish the address.';
    },
    ls() {
      return Object.keys(files).map(f => '-rw-r--r--  1 bob  staff  ' + (files[f].length) + '  ' + f).join('\n');
    },
    cat(arg) {
      if (!arg) return 'usage: cat <file>';
      const name = arg.trim();
      if (files[name]) return files[name];
      return `cat: ${name}: No such file or directory`;
    },
    sudo(arg) {
      if (!arg) return 'usage: sudo <command>';
      return `Permission denied: guest is not in the sudoers file.\nThis incident will be reported. (It will not.)`;
    },
    date() {
      return new Date().toString();
    },
    matrix() {
      toggleMatrix();
      return 'wake up...';
    },
    clear() {
      log.innerHTML = '';
      return null;
    },
  };

  const aliases = { exit: () => 'this isn\'t that kind of terminal.', quit: () => commands.exit && commands.exit() };

  async function runCommand(raw) {
    const trimmed = raw.trim();
    if (!trimmed) return;
    append(`<span class="prompt-label">guest@boblaz</span><span class="dim">:~$</span> ${escapeHtml(trimmed)}`);

    const [cmd, ...rest] = trimmed.split(/\s+/);
    const arg = rest.join(' ');
    const lower = cmd.toLowerCase();

    let output;
    if (commands[lower]) {
      output = commands[lower](arg);
    } else if (aliases[lower]) {
      output = aliases[lower](arg);
    } else {
      output = `command not found: ${cmd}\ntype 'help' for a list of commands`;
    }

    if (output) append(escapeHtml(output).replace(/\n/g, '<br>'));
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Input handling — keep a real (offscreen) input focused for mobile keyboards.
  let buffer = '';
  const history = [];
  let historyIdx = -1;

  function renderTyped() {
    typedEl.textContent = buffer;
  }

  hiddenInput.addEventListener('input', () => {
    buffer = hiddenInput.value;
    renderTyped();
  });

  hiddenInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const cmd = buffer;
      if (cmd.trim()) { history.push(cmd); }
      historyIdx = history.length;
      buffer = '';
      hiddenInput.value = '';
      renderTyped();
      await runCommand(cmd);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIdx > 0) { historyIdx--; buffer = history[historyIdx] || ''; hiddenInput.value = buffer; renderTyped(); }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIdx < history.length) { historyIdx++; buffer = history[historyIdx] || ''; hiddenInput.value = buffer; renderTyped(); }
    }
  });

  screen.addEventListener('click', () => hiddenInput.focus());

  // Matrix rain easter egg
  let matrixOn = false;
  let matrixRAF = null;
  function toggleMatrix() {
    const canvas = document.getElementById('matrix');
    matrixOn = !matrixOn;
    if (!matrixOn) {
      canvas.style.display = 'none';
      if (matrixRAF) cancelAnimationFrame(matrixRAF);
      return;
    }
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    const cols = Math.floor(canvas.width / 16);
    const drops = new Array(cols).fill(0);
    const chars = 'アイウエオカキクケコサシスセソ01';
    let frame = 0;
    function draw() {
      ctx.fillStyle = 'rgba(10, 14, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#3bf777';
      ctx.font = '14px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * 16, drops[i] * 16);
        if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      frame++;
      if (matrixOn && frame < 260) {
        matrixRAF = requestAnimationFrame(draw);
      } else if (matrixOn) {
        matrixOn = false;
        canvas.style.display = 'none';
      }
    }
    draw();
  }

  // Boot sequence
  (async () => {
    for (const line of boot) {
      if (line.speed === 0) {
        append('&nbsp;');
      } else {
        await typeLine(line.t, { speed: line.speed, cls: line.cls || '' });
      }
      await sleep(40);
    }
    await typeLine("Type 'help' to get started.", { speed: 10, cls: 'bright' });
    append('&nbsp;');
    inputLine.style.display = 'flex';
    hiddenInput.focus();
    renderTyped();
  })();

  window.addEventListener('resize', () => {
    const canvas = document.getElementById('matrix');
    if (canvas.style.display === 'block') {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  });
})();
</script>

</body>
</html>
